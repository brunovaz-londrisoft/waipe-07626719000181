# Gerado pelo framework Waipe. Valida todo agente e modelo do catálogo.
name: Validar agentes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 .claude/waipe/waipe.py validar
